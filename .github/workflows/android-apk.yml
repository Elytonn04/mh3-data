name: Build Android APK

on:
  push:
    branches: [main, android-app]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar o APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MH3-Database.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MH3-Database-apk
          path: MH3-Database.apk

      # Tags no formato v1.0.0 também publicam o APK na aba Releases.
      - name: Publicar na aba Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MH3-Database.apk
          generate_release_notes: true
