plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mh3.database'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mh3.database'
        minSdk 24
        targetSdk 34
        // Cada build no GitHub Actions sobe o número da versão, então um APK novo
        // sempre pode ser instalado por cima do anterior.
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }

    // Chave de assinatura de teste fixa, guardada no repositório. Com a mesma chave
    // em todo build, o Android aceita atualizar o app sem desinstalar.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
